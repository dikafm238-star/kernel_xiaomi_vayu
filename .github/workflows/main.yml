name: Build Kernel CAF Vayu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: caf

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache cgit flex glibc-source libelf-dev libssl-dev libstdc++6 git-core gnupg gperf zip unzip curl info

    - name: Download Proton Clang Compiler
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Mulai Compile Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        make O=out vayu_defconfig
        make O=out -j$(nproc --all)

    - name: Bungkus Jadi Zip Siap Flash
      run: |
        cd anykernel
        cp ../out/arch/arm64/boot/Image.gz-dtb . || cp ../out/arch/arm64/boot/Image .
        zip -r9 ../Anymore-CAF-Vayu-KSU.zip *

    - name: Upload File Kernel Lo
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-CAF-PocoX3Pro
        path: Anymore-CAF-Vayu-KSU.zip
