name: Build Kernel CAF Vayu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: caf

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache cgit flex glibc-source libelf-dev libssl-dev libstdc++6 git-core gnupg gperf zip unzip curl gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi device-tree-compiler

    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Mulai Compile Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export LLVM=1
        export LLVM_IAS=1
        
        # Bersihkan build
        make O=out mrproper
        
        # Konfigurasi Vayu
        make O=out vayu_defconfig
        
        # Bypass error dtc dan stack protector
        ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
        ./scripts/config --file out/.config --enable CONFIG_CC_STACKPROTECTOR_NONE
        
        # Build dengan flag tambahan agar compiler tidak rewel
        make O=out -j$(nproc --all) \
        KCFLAGS="-w"

    - name: Bungkus Jadi Zip
      run: |
        cd anykernel
        cp ../out/arch/arm64/boot/Image.gz-dtb . || cp ../out/arch/arm64/boot/Image .
        zip -r9 ../Anymore-CAF-Vayu-KSU.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-CAF-PocoX3Pro
        path: Anymore-CAF-Vayu-KSU.zip
